<!DOCTYPE html>
<html lang="en" class="light-style layout-menu-fixed" dir="ltr" data-theme="theme-default">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ea580c">
  <meta name="robots" content="noindex, nofollow">
  <title>Madina Fire Works</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">

  <!-- Bump ?v= on every release so phones fetch the new files -->
  <link rel="stylesheet" href="css/vendor/core.css?v=1">
  <link rel="stylesheet" href="css/vendor/theme.css?v=1">
  <link rel="stylesheet" href="css/app.css?v=1">
</head>
<body>

  <!-- Login -->
  <div id="login-screen" class="login-screen d-none">
    <div class="login-card card">
      <div class="card-body p-4 p-sm-5">
        <div class="text-center mb-4">
          <img data-brand-logo alt="" class="login-logo mb-3">
          <h4 class="mb-1" data-brand-name></h4>
          <p class="text-muted mb-0" data-brand-tagline></p>
        </div>
        <div id="login-setup-hint" class="alert alert-warning small d-none">
          The API URL isn't set yet. Add your Apps Script Web App URL to <code>config.js</code>.
        </div>
        <form id="login-form" autocomplete="on">
          <label class="form-label" for="login-password">Password</label>
          <div class="input-group input-group-merge mb-3">
            <span class="input-group-text"><i class="bx bx-lock-alt"></i></span>
            <input type="password" class="form-control form-control-lg" id="login-password" autocomplete="current-password" required placeholder="Enter password">
          </div>
          <div id="login-error" class="alert alert-danger small py-2 d-none"></div>
          <button type="submit" id="login-btn" class="btn btn-primary btn-lg w-100">Log in</button>
        </form>
      </div>
    </div>
  </div>

  <!-- App -->
  <div id="app-shell" class="layout-wrapper layout-content-navbar d-none">
    <div class="layout-container">

      <aside id="layout-menu" class="layout-menu menu-vertical menu bg-menu-theme">
        <div class="app-brand">
          <a href="#/home" class="app-brand-link">
            <img data-brand-logo alt="" class="app-brand-logo-img">
            <span class="app-brand-text menu-text fw-bolder ms-2" data-brand-name></span>
          </a>
          <a href="javascript:void(0);" class="layout-menu-toggle menu-link text-large ms-auto d-block d-xl-none">
            <i class="bx bx-chevron-left bx-sm align-middle"></i>
          </a>
        </div>
        <ul class="menu-inner py-1" id="menu-items"></ul>
      </aside>

      <div class="layout-page">
        <nav class="layout-navbar container-xxl navbar navbar-expand-xl navbar-detached align-items-center bg-navbar-theme" id="layout-navbar">
          <div class="layout-menu-toggle navbar-nav align-items-xl-center me-3 me-xl-0 d-none d-md-flex d-xl-none">
            <a class="nav-item nav-link px-0" href="javascript:void(0)" aria-label="Menu"><i class="bx bx-menu bx-sm"></i></a>
          </div>
          <img data-brand-logo alt="" class="navbar-logo d-md-none me-2">
          <h5 class="mb-0 page-title text-truncate" id="page-title"></h5>
          <div class="navbar-nav-right d-flex align-items-center ms-auto">
            <button type="button" id="sync-status" class="btn btn-sm sync-pill text-muted"><i class="bx bx-cloud"></i><span class="sync-label">Ready</span></button>
            <a href="#/settings" class="btn btn-sm btn-icon btn-outline-secondary ms-2 rounded-circle" aria-label="Settings"><i class="bx bx-cog"></i></a>
          </div>
        </nav>

        <div class="content-wrapper">
          <div class="container-xxl flex-grow-1 container-p-y" id="page-content"></div>
        </div>
      </div>
    </div>

    <div class="layout-overlay layout-menu-toggle"></div>

    <!-- Floating "+ New" -->
    <div class="dropup fab-wrap">
      <button class="btn btn-primary fab" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="New">
        <i class="bx bx-plus"></i><span class="fab-label">New</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow" id="fab-menu"></ul>
    </div>

    <!-- Mobile bottom navigation -->
    <nav class="bottom-nav" id="bottom-nav"></nav>

    <!-- Mobile "More" sheet -->
    <div class="offcanvas offcanvas-bottom more-sheet" tabindex="-1" id="more-sheet" aria-labelledby="more-sheet-title">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="more-sheet-title">All sections</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body"><div class="more-grid" id="more-items"></div></div>
    </div>
  </div>

  <div id="toast-area" class="toast-container position-fixed p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="config.js?v=1"></script>
  <script src="js/util.js?v=1"></script>
  <script src="js/db.js?v=1"></script>
  <script src="js/store.js?v=1"></script>
  <script src="js/api.js?v=1"></script>
  <script src="js/ui.js?v=1"></script>
  <script src="js/views/home.js?v=1"></script>
  <script src="js/views/settings.js?v=1"></script>
  <script src="js/views/placeholders.js?v=1"></script>
  <script src="js/app.js?v=1"></script>
</body>
</html>
